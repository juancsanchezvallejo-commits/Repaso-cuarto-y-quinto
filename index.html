<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repaso Ciencias Sociales — Gimnasio Domingo Savio</title>
<style>
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --border: #e2e0d8;
    --text: #1a1a18;
    --muted: #6b6960;
    --accent: #1a4fa0;
    --accent-light: #e8eef8;
    --success: #1a7a4a;
    --success-light: #e8f5ed;
    --danger: #b83030;
    --danger-light: #fceaea;
    --warn: #a06010;
    --warn-light: #fdf3e0;
    --grade4: #5a3db8;
    --grade4-light: #f0edfb;
    --grade5: #1a7a4a;
    --grade5-light: #e8f5ed;
    --radius: 10px;
    --shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); min-height: 100vh; }
  
  /* NAV */
  .navbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .navbar-brand { font-weight: 700; font-size: 1rem; color: var(--accent); letter-spacing: -0.3px; }
  .navbar-sub { font-size: 0.8rem; color: var(--muted); }
  
  /* HERO */
  .hero { background: var(--surface); border-bottom: 1px solid var(--border); padding: 2rem 1.5rem 1.5rem; }
  .hero h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 0.4rem; }
  .hero p { color: var(--muted); font-size: 0.95rem; }
  
  /* GRADE TABS */
  .grade-tabs { display: flex; gap: 0.5rem; padding: 1rem 1.5rem 0; }
  .grade-tab { padding: 0.5rem 1.2rem; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all .15s; color: var(--muted); }
  .grade-tab.active[data-grade="4"] { background: var(--grade4-light); border-color: var(--grade4); color: var(--grade4); }
  .grade-tab.active[data-grade="5"] { background: var(--grade5-light); border-color: var(--grade5); color: var(--grade5); }
  .grade-tab:hover { border-color: #aaa; }
  
  /* TOPIC NAV */
  .topic-nav { padding: 0.75rem 1.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .topic-btn { padding: 0.35rem 0.9rem; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); font-size: 0.8rem; cursor: pointer; transition: all .15s; color: var(--muted); }
  .topic-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .topic-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  
  /* MAIN LAYOUT */
  .main { padding: 1rem 1.5rem 4rem; max-width: 860px; }
  
  /* SECTION */
  .section { display: none; }
  .section.active { display: block; }
  
  /* ACTIVITY CARD */
  .activity { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; box-shadow: var(--shadow); }
  .activity-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
  .activity-type { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 0.2rem 0.6rem; border-radius: 20px; }
  .type-mc { background: #e8eef8; color: #1a4fa0; }
  .type-match { background: #fdf3e0; color: #a06010; }
  .type-order { background: #f0edfb; color: #5a3db8; }
  .type-fill { background: #e8f5ed; color: #1a7a4a; }
  .type-true { background: #fceaea; color: #b83030; }
  .activity-q { font-size: 1rem; font-weight: 600; line-height: 1.5; color: var(--text); }
  .activity-context { font-size: 0.875rem; color: var(--muted); margin-top: 0.25rem; font-style: italic; }
  
  /* MC OPTIONS */
  .options { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.9rem; }
  .option { padding: 0.65rem 1rem; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: all .12s; display: flex; align-items: flex-start; gap: 0.75rem; }
  .option-letter { font-weight: 700; min-width: 22px; color: var(--muted); }
  .option:hover { border-color: var(--accent); background: var(--accent-light); }
  .option.selected { border-color: var(--accent); background: var(--accent-light); }
  .option.correct { border-color: var(--success); background: var(--success-light); }
  .option.correct .option-letter { color: var(--success); }
  .option.wrong { border-color: var(--danger); background: var(--danger-light); }
  .option.wrong .option-letter { color: var(--danger); }
  .option.revealed-correct { border-color: var(--success); background: var(--success-light); }
  .option.revealed-correct .option-letter { color: var(--success); }
  
  /* FEEDBACK */
  .feedback { margin-top: 0.75rem; padding: 0.6rem 0.9rem; border-radius: 7px; font-size: 0.875rem; display: none; }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--success-light); color: var(--success); border-left: 3px solid var(--success); }
  .feedback.err { background: var(--danger-light); color: var(--danger); border-left: 3px solid var(--danger); }
  
  /* CHECK BTN */
  .check-btn { margin-top: 0.8rem; padding: 0.5rem 1.2rem; background: var(--accent); color: #fff; border: none; border-radius: 7px; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  .check-btn:hover { opacity: 0.88; }
  .check-btn:disabled { opacity: 0.4; cursor: default; }
  
  /* MATCH ACTIVITY */
  .match-area { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem; margin-top: 0.9rem; }
  .match-col-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 0.3rem; }
  .match-item { padding: 0.55rem 0.8rem; border: 1.5px solid var(--border); border-radius: 7px; font-size: 0.875rem; cursor: pointer; transition: all .12s; min-height: 44px; display: flex; align-items: center; }
  .match-item:hover { border-color: var(--accent); }
  .match-item.selected-left { border-color: var(--accent); background: var(--accent-light); font-weight: 600; }
  .match-item.selected-right { border-color: var(--grade4); background: var(--grade4-light); }
  .match-item.paired { border-color: var(--success); background: var(--success-light); color: var(--success); }
  .match-item.wrong-pair { border-color: var(--danger); background: var(--danger-light); animation: shake .3s; }
  .match-lines { position: relative; margin-top: 0.5rem; }
  .match-instruction { font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem; }
  
  /* ORDER ACTIVITY */
  .order-list { display: flex; flex-direction: column; gap: 0.45rem; margin-top: 0.9rem; }
  .order-item { padding: 0.6rem 0.9rem; border: 1.5px solid var(--border); border-radius: 7px; font-size: 0.875rem; cursor: grab; display: flex; align-items: center; gap: 0.75rem; transition: all .12s; background: var(--surface); }
  .order-item:hover { border-color: var(--accent); }
  .order-item.dragging { opacity: 0.5; }
  .order-item.drag-over { border-color: var(--accent); background: var(--accent-light); }
  .drag-handle { color: var(--muted); font-size: 1rem; cursor: grab; }
  .order-number { font-weight: 700; color: var(--muted); min-width: 22px; font-size: 0.85rem; }
  
  /* TRUE/FALSE */
  .tf-options { display: flex; gap: 0.75rem; margin-top: 0.9rem; flex-wrap: wrap; }
  .tf-btn { padding: 0.6rem 1.5rem; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all .12s; }
  .tf-btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .tf-btn.selected-tf { border-color: var(--accent); background: var(--accent-light); }
  .tf-btn.correct-tf { border-color: var(--success); background: var(--success-light); color: var(--success); }
  .tf-btn.wrong-tf { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
  
  /* FILL IN */
  .fill-area { margin-top: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; font-size: 0.95rem; line-height: 2; }
  .fill-blank { border: none; border-bottom: 2px solid var(--accent); background: transparent; font-size: 0.95rem; padding: 0 0.3rem; min-width: 100px; outline: none; color: var(--text); }
  .fill-blank.correct-fill { border-color: var(--success); background: var(--success-light); border-radius: 4px 4px 0 0; }
  .fill-blank.wrong-fill { border-color: var(--danger); background: var(--danger-light); border-radius: 4px 4px 0 0; }
  
  /* WORD BANK */
  .word-bank { margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .word-chip { padding: 0.3rem 0.7rem; background: var(--accent-light); border: 1px solid #b8c8e8; border-radius: 20px; font-size: 0.82rem; color: var(--accent); cursor: pointer; transition: all .12s; }
  .word-chip:hover { background: var(--accent); color: #fff; }
  .word-chip.used { opacity: 0.35; pointer-events: none; text-decoration: line-through; }
  
  /* SCORE PANEL */
  .score-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.5rem; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
  .score-label { font-size: 0.85rem; color: var(--muted); }
  .score-value { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .reset-btn { padding: 0.4rem 0.9rem; border: 1px solid var(--border); background: transparent; border-radius: 6px; font-size: 0.8rem; cursor: pointer; color: var(--muted); transition: all .12s; }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
  
  /* SECTION TITLE */
  .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.25rem; margin-top: 1.25rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--border); }
  .section-subtitle { font-size: 0.82rem; color: var(--muted); margin-bottom: 1rem; }
  
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  
  @media(max-width:600px) {
    .match-area { grid-template-columns: 1fr; }
    .hero h1 { font-size: 1.3rem; }
    .main { padding: 1rem 1rem 4rem; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div>
    <div class="navbar-brand">🏫 Gimnasio Domingo Savio</div>
    <div class="navbar-sub">Ciencias Sociales — Repaso Primer Término</div>
  </div>
</nav>

<div class="hero">
  <h1>Guía de estudio interactiva</h1>
  <p>Practica los temas de cada grado con preguntas, emparejamiento y ordenamiento.</p>
</div>

<div class="grade-tabs">
  <button class="grade-tab active" data-grade="4" onclick="switchGrade(4)">Cuarto grado</button>
  <button class="grade-tab" data-grade="5" onclick="switchGrade(5)">Quinto grado</button>
</div>

<!-- ===== GRADO 4 ===== -->
<div id="grade4" class="section active">
  <div class="topic-nav" id="topics4"></div>
  <div class="main" id="content4"></div>
</div>

<!-- ===== GRADO 5 ===== -->
<div id="grade5" class="section">
  <div class="topic-nav" id="topics5"></div>
  <div class="main" id="content5"></div>
</div>

<script>
// =================== DATA ===================

const DATA = {
  4: {
    topics: [
      { id: "mapas", label: "Tipos de mapas y territorio" },
      { id: "pobladores", label: "Primeros pobladores de América" },
      { id: "precolombinas", label: "Sociedades precolombinas" },
      { id: "termicos", label: "Pisos térmicos" },
      { id: "ciudadanas4", label: "Competencias ciudadanas" },
    ],
    activities: {
      mapas: [
        {
          type: "mc",
          q: "Un arqueólogo encuentra restos de una antigua ciudad enterrada a 800 metros de profundidad bajo los Andes colombianos. ¿Sobre cuál de las cinco dimensiones territoriales colombianas ejerce el Estado su soberanía en este caso?",
          opts: ["El espacio aéreo, porque todo lo que está encima de la superficie pertenece al Estado.", "El subsuelo, que otorga a Colombia derechos exclusivos sobre todos los recursos y vestigios que se encuentren debajo de la superficie terrestre.", "El espacio marítimo, porque los Andes tienen ríos que desembocan en el mar.", "El espacio insular, porque la ciudad podría estar conectada con islas del Pacífico."],
          ans: 1,
          exp: "El subsuelo es una de las cinco dimensiones del territorio colombiano: continental, marítimo, insular, aéreo y subsuelo. Todo lo que se encuentre bajo la superficie terrestre es patrimonio exclusivo del Estado colombiano."
        },
        {
          type: "mc",
          q: "Una investigadora quiere saber tres cosas distintas: dónde están los ríos y montañas del país; cuáles son los límites entre departamentos; y dónde se concentran los cultivos de café. ¿Qué combinación de mapas necesita, en ese orden?",
          opts: ["Mapa político → mapa físico → mapa temático", "Mapa físico → mapa político → mapa temático, porque cada uno tiene un propósito distinto: naturaleza, fronteras y datos específicos.", "Planisferio → mapa físico → mapa temático", "Mapa temático → mapa temático → mapa político"],
          ans: 1,
          exp: "El mapa físico muestra relieve y elementos naturales. El político muestra límites administrativos. El temático representa un fenómeno específico como cultivos, población, etc."
        },
        {
          type: "match",
          q: "Une cada tipo de mapa con lo que muestra.",
          left: ["Mapa físico", "Mapa político", "Mapa temático", "Planisferio"],
          right: ["Representa el relieve: montañas, ríos y llanuras", "Muestra un fenómeno específico como temperatura o cultivos", "Contiene todos los países del mundo en una sola vista", "Indica fronteras entre países, departamentos y municipios"],
          ans: [0, 3, 1, 2],
          exp: "Cada tipo de mapa tiene una función específica. Conocer sus diferencias permite elegir la herramienta correcta para cada propósito geográfico."
        },
        {
          type: "mc",
          q: "En un mapa físico de Colombia, las llanuras del Orinoco aparecen en verde claro y las cimas nevadas en blanco. ¿Qué comunica esta diferencia de colores?",
          opts: ["Indica la temperatura promedio: verde = caliente, blanco = frío.", "Muestra las divisiones políticas entre departamentos.", "Representa la altimetría: el verde señala tierras bajas y el blanco indica zonas elevadas como nevados, permitiendo leer el relieve del mapa.", "Señala la cantidad de biodiversidad en cada región."],
          ans: 2,
          exp: "En cartografía física, los colores representan altitud. El verde indica zonas bajas, los marrones zonas intermedias y el blanco las cimas nevadas. Este 'lenguaje visual' permite entender el relieve sin visitar el lugar."
        },
        {
          type: "mc",
          q: "Las islas de San Andrés, Providencia y la isla de Malpelo son parte del territorio colombiano aunque estén en el océano, lejos del continente. ¿A cuál espacio territorial pertenecen?",
          opts: ["Al espacio marítimo, porque están rodeadas de agua.", "Al espacio continental, porque la ley las incluye en la masa terrestre principal.", "Al espacio insular, formado por islas, archipiélagos e islotes sobre los que Colombia ejerce plena soberanía.", "Al espacio aéreo, porque lo más relevante es el cielo que las cubre."],
          ans: 2,
          exp: "El espacio insular comprende todas las islas, islotes y archipiélagos del territorio nacional, tanto en el Mar Caribe como en el Océano Pacífico."
        },
        {
          type: "tf",
          q: "Las convenciones de un mapa sirven para decorarlo y hacerlo más atractivo visualmente.",
          ans: false,
          exp: "FALSO. Las convenciones (leyenda) son esenciales para interpretar correctamente los colores, símbolos y líneas del mapa. Sin ellas, sería imposible entender lo que el mapa representa."
        },
        {
          type: "mc",
          q: "Observando un mapa histórico de América del Sur que muestra los cambios territoriales de Colombia desde 1825, ¿qué puedes concluir si el mapa muestra fronteras distintas en cada época?",
          opts: ["Colombia ha crecido hasta incluir a todos sus países vecinos.", "El territorio ha permanecido igual desde la independencia.", "Colombia se dividió para formar únicamente a Brasil.", "El territorio colombiano ha sufrido modificaciones en sus fronteras y extensión a lo largo de la historia."],
          ans: 3,
          exp: "Los mapas históricos muestran cómo los territorios cambian con el tiempo. Colombia, que alguna vez fue parte de la Gran Colombia, ha tenido modificaciones significativas en sus fronteras."
        },
      ],
      pobladores: [
        {
          type: "mc",
          q: "La teoría más aceptada dice que los primeros humanos llegaron a América cruzando el Estrecho de Bering. ¿Qué fenómeno natural hizo posible ese cruce y por qué ya no se podría hacer hoy caminando?",
          opts: ["Los pobladores construyeron un puente de madera; este se destruyó con los siglos.", "Durante una era glacial el estrecho se congeló formando un puente de tierra entre Asia y América. Cuando el hielo se derritió, el mar volvió a separar los continentes.", "Un terremoto abrió un túnel submarino que luego quedó sellado.", "El Océano Pacífico se secó completamente, permitiendo caminar desde Asia hasta América del Sur."],
          ans: 1,
          exp: "La Teoría del Estrecho de Bering (Beringia) plantea que durante la última glaciación el nivel del mar bajó, exponiendo un puente de tierra. Al terminar la glaciación, el hielo se derritió y el mar cubrió ese camino nuevamente."
        },
        {
          type: "order",
          q: "Ordena los tres grandes períodos del poblamiento americano del más antiguo al más reciente.",
          items: ["Período Formativo: nacen sociedades organizadas con cacicazgos y cultos religiosos", "Período Arcaico: grupos se vuelven sedentarios gracias a la agricultura", "Período Paleoindio: grupos nómadas de cazadores y recolectores"],
          correctOrder: [2, 1, 0],
          exp: "El orden cronológico es: Paleoindio (nómadas cazadores) → Arcaico (sedentarismo y agricultura) → Formativo (organización política y religiosa)."

        {
          type: "mc",
          q: "Los primeros pobladores eran nómadas en el período Paleoindio pero se volvieron sedentarios en el período Arcaico. ¿Qué cambio fundamental explica este paso?",
          opts: ["Aprendieron a construir casas más resistentes.", "Los animales que cazaban se extinguieron y tuvieron que esperar.", "Los líderes ordenaron dejar de moverse por el peligro de los depredadores.", "Desarrollaron los primeros cultivos agrícolas, lo que les permitió producir alimento en un lugar fijo en vez de desplazarse a cazar."],
          ans: 3,
          exp: "La agricultura es el cambio más revolucionario en la historia humana. Poder cultivar alimentos propios eliminó la necesidad de seguir a los animales, permitiendo establecerse permanentemente en un lugar."
        },
        {
          type: "mc",
          q: "Existen tres teorías sobre las rutas de poblamiento de América. Si un grupo llegó en balsas desde islas del Pacífico y otro bordeó la Antártida, ¿cuál es la diferencia principal entre estas rutas y la del Estrecho de Bering?",
          opts: ["Las tres rutas son iguales porque todos venían de Asia.", "Solo la de Bering es científicamente válida; las otras son leyendas.", "Las tres tienen orígenes y medios de viaje distintos: Bering fue terrestre por hielo, la del Pacífico fue marítima en balsas, y la antártica bordeó el extremo sur; cada una pobló zonas diferentes.", "La ruta antártica fue la primera porque es la más corta."],
          ans: 2,
          exp: "Cada ruta representa una hipótesis distinta sobre el origen de los americanos. La diversidad de rutas explica la gran variedad de grupos humanos que habitaron distintas zonas del continente."
        },
        {
          type: "fill",
          q: "Completa con el banco de palabras:",
          sentence: "En el período {0}, los humanos vivían como nómadas cazadores. Luego, en el período {1}, la invención de la {2} les permitió volverse sedentarios. Finalmente, en el período {3}, surgieron los primeros {4} y cultos religiosos.",
          blanks: ["Paleoindio", "Arcaico", "agricultura", "Formativo", "cacicazgos"],
          exp: "Este es el proceso de desarrollo de las sociedades americanas precolombinas, desde los primeros cazadores hasta la formación de sociedades complejas."
        },
        {
          type: "mc",
          q: "¿Qué diferencia fundamental existe entre el período Formativo y el período Paleoindio en la organización social?",
          opts: ["En el Formativo los grupos volvieron al nomadismo porque la agricultura fracasó.", "Son idénticos: solo cambian los nombres de los líderes.", "En el Formativo nacieron las primeras sociedades organizadas con cacicazgos y cultos religiosos, mientras en el Paleoindio los grupos eran nómadas sin organización política ni religiosa.", "En el Formativo llegaron los humanos por primera vez a América."],
          ans: 2,
          exp: "El período Formativo representa un salto cualitativo: surgen las primeras formas de gobierno (cacicazgos), la religión organizada, el comercio y la especialización del trabajo."
        },
      ],
      precolombinas: [
        {
          type: "mc",
          q: "La sociedad muisca tenía una organización piramidal. Si un joven quería ser guerrero güecha, ¿en qué nivel de la pirámide social estaría y quiénes quedarían por encima de él?",
          opts: ["En la cima, por encima del Zipa, porque los guerreros eran los más respetados.", "En el cuarto nivel: sobre él estarían el Zipa o Zaque, el cacique local y los jeques o sacerdotes; debajo estarían los agricultores, artesanos y mineros.", "En el nivel más bajo, porque los guerreros no tenían reconocimiento social.", "En el segundo nivel, solo por debajo del Zipa."],
          ans: 1,
          exp: "La jerarquía muisca era: Zipa/Zaque → caciques → jeques (sacerdotes) → guerreros güechas → agricultores, artesanos y mineros. Los guerreros ocupaban el cuarto lugar en esta pirámide."
        },
        {
          type: "match",
          q: "Une cada divinidad o autoridad muisca con su función o significado.",
          left: ["Zipa", "Zaque", "Bachué", "Bochica", "Chimininagua"],
          right: ["Gobernaba el sur del altiplano desde Bogotá; representaba la luna (Chía)", "Creador supremo y principio del bien en la cosmología muisca", "Dios civilizador que enseñó a los hombres a cultivar y tejer", "Gobernaba el norte desde Tunja; representaba el sol (Xue)", "Madre de la humanidad: emergió de la laguna de Iguaque con el primer hombre"],
          ans: [0, 3, 4, 2, 1],
          exp: "La cosmología muisca era rica y compleja. Chimininagua era el dios creador; Bachué, la madre de la humanidad; y Bochica, el dios civilizador. El Zipa y el Zaque eran los líderes políticos del altiplano."

};

// =================== STATE ===================
let state = {
  grade: 4,
  topic4: "mapas",
  topic5: "mun",
  scores: { 4: { correct: 0, total: 0 }, 5: { correct: 0, total: 0 } },
  matchState: {},
  orderState: {}
};

// =================== INIT ===================
function init() {
  buildTopicNav(4);
  buildTopicNav(5);
  renderContent(4, state.topic4);
  renderContent(5, state.topic5);
}

function buildTopicNav(grade) {
  const nav = document.getElementById(`topics${grade}`);
  const topics = DATA[grade].topics;
  nav.innerHTML = topics.map(t =>
    `<button class="topic-btn ${state['topic'+grade]===t.id?'active':''}" onclick="switchTopic(${grade},'${t.id}')">${t.label}</button>`
  ).join('');
}

function switchGrade(grade) {
  state.grade = grade;
  document.querySelectorAll('.grade-tab').forEach(b => b.classList.remove('active'));
  document.querySelector(`.grade-tab[data-grade="${grade}"]`).classList.add('active');
  document.getElementById('grade4').classList.toggle('active', grade === 4);
  document.getElementById('grade5').classList.toggle('active', grade === 5);
}

function switchTopic(grade, topicId) {
  state['topic'+grade] = topicId;
  buildTopicNav(grade);
  renderContent(grade, topicId);
}

// =================== RENDER ===================
function renderContent(grade, topicId) {
  const container = document.getElementById(`content${grade}`);
  const activities = DATA[grade].activities[topicId];
  const scoreData = state.scores[grade];

  let html = `
    <div class="score-panel">
      <div>
        <div class="score-label">Puntaje en esta sesión</div>
        <div class="score-value" id="score-display-${grade}">${scoreData.correct} / ${scoreData.total}</div>
      </div>
      <button class="reset-btn" onclick="resetScore(${grade})">Reiniciar puntaje</button>
    </div>
  `;

  const topicLabel = DATA[grade].topics.find(t=>t.id===topicId)?.label || '';
  html += `<div class="section-title">${topicLabel}</div>`;
  html += `<div class="section-subtitle">Resuelve las actividades. Haz clic en las respuestas para verificarlas.</div>`;

  activities.forEach((act, i) => {
    html += buildActivity(act, grade, topicId, i);
  });

  container.innerHTML = html;
  initMatchActivities(grade, topicId, activities);
  initOrderActivities(grade, topicId, activities);
}

function buildActivity(act, grade, topicId, idx) {
  const typeLabels = { mc: 'selección múltiple', match: 'emparejamiento', order: 'ordenamiento', fill: 'completar', tf: 'verdadero / falso' };
  const typeClass = { mc: 'type-mc', match: 'type-match', order: 'type-order', fill: 'type-fill', tf: 'type-true' };
  const id = `${grade}_${topicId}_${idx}`;

  let body = '';
  if (act.type === 'mc') body = buildMC(act, id);
  else if (act.type === 'match') body = buildMatch(act, id);
  else if (act.type === 'order') body = buildOrder(act, id);
  else if (act.type === 'fill') body = buildFill(act, id);
  else if (act.type === 'tf') body = buildTF(act, id);

  return `
    <div class="activity" id="act_${id}">
      <div class="activity-header">
        <span class="activity-type ${typeClass[act.type]}">${typeLabels[act.type]}</span>
        <span style="font-size:0.78rem;color:var(--muted)">Pregunta ${idx+1}</span>
      </div>
      <div class="activity-q">${act.q}</div>
      ${body}
      <div class="feedback" id="fb_${id}"></div>
    </div>
  `;
}

function buildMC(act, id) {
  const letters = ['A','B','C','D','E'];
  return `<div class="options">${act.opts.map((o,i)=>`
    <div class="option" id="opt_${id}_${i}" onclick="selectMC('${id}',${i},${act.ans})">
      <span class="option-letter">${letters[i]}</span>
      <span>${o}</span>
    </div>`).join('')}
  </div>`;
}

function buildTF(act, id) {
  return `<div class="tf-options">
    <button class="tf-btn" id="tf_${id}_true" onclick="selectTF('${id}',true,${act.ans})">✔ Verdadero</button>
    <button class="tf-btn" id="tf_${id}_false" onclick="selectTF('${id}',false,${act.ans})">✘ Falso</button>
  </div>`;
}

function buildFill(act, id) {
  let sentence = act.sentence;
  act.blanks.forEach((b, i) => {
    sentence = sentence.replace(`{${i}}`, `<input class="fill-blank" id="fill_${id}_${i}" placeholder="___" style="width:${Math.max(80,b.length*10)}px">`);
  });
  const wordBank = `<div class="word-bank">${act.blanks.map((w,i)=>`<span class="word-chip" id="chip_${id}_${i}" onclick="useWord('${id}',${i},'${w}')">${w}</span>`).join('')}</div>`;
  return `<div class="fill-area">${sentence}</div>
    <div style="margin-top:0.6rem;font-size:0.78rem;color:var(--muted)">Banco de palabras:</div>
    ${wordBank}
    <button class="check-btn" onclick="checkFill('${id}',${JSON.stringify(act.blanks)})">Verificar</button>`;
}

function buildMatch(act, id) {
  const shuffledRight = [...act.right.map((r,i)=>({text:r,origIdx:i}))].sort(()=>Math.random()-0.5);
  window[`matchData_${id}`] = { left: act.left, rightShuffled: shuffledRight, ans: act.ans, pairs: [] };

  return `
    <p class="match-instruction">Haz clic en un elemento de la izquierda, luego en su pareja de la derecha.</p>
    <div class="match-area" id="match_${id}">
      <div>
        <div class="match-col-label">Columna A</div>
        ${act.left.map((l,i)=>`<div class="match-item" id="ml_${id}_${i}" onclick="pickLeft('${id}',${i})">${l}</div>`).join('')}
      </div>
      <div>
        <div class="match-col-label">Columna B</div>
        ${shuffledRight.map((r,i)=>`<div class="match-item" id="mr_${id}_${i}" onclick="pickRight('${id}',${i})">${r.text}</div>`).join('')}
      </div>
    </div>
  `;
}

function buildOrder(act, id) {
  const shuffled = act.items.map((item, origIdx) => ({text: item, origIdx})).sort(()=>Math.random()-0.5);
  window[`orderData_${id}`] = { items: shuffled, correctOrder: act.correctOrder, dragSrc: null };

  return `
    <p class="match-instruction">Arrastra los elementos para ordenarlos correctamente (del primero al último).</p>
    <div class="order-list" id="order_${id}">
      ${shuffled.map((item,i)=>`
        <div class="order-item" draggable="true" id="oi_${id}_${i}" data-idx="${i}"
          ondragstart="dragStart('${id}',${i})" ondragover="dragOver(event,'${id}',${i})" ondrop="drop(event,'${id}',${i})" ondragleave="dragLeave('${id}',${i})">
          <span class="drag-handle">⠿</span>
          <span class="order-number">${i+1}</span>
          <span>${item.text}</span>
        </div>`).join('')}
    </div>
    <button class="check-btn" onclick="checkOrder('${id}')">Verificar orden</button>
  `;
}

// =================== INTERACTIONS ===================

function selectMC(id, chosen, correct) {
  const opts = document.querySelectorAll(`[id^="opt_${id}_"]`);
  if ([...opts].some(o => o.classList.contains('correct') || o.classList.contains('wrong'))) return;

  const grade = parseInt(id.split('_')[0]);
  state.scores[grade].total++;

  opts.forEach((opt, i) => {
    if (i === correct) opt.classList.add(chosen===correct ? 'correct' : 'revealed-correct');
    else if (i === chosen) opt.classList.add('wrong');
  });

  const actEl = document.getElementById(`act_${id}`);
  const actIdx = parseInt(id.split('_')[2]);
  const topicId = id.split('_')[1];
  const act = DATA[grade].activities[topicId][actIdx];

  showFeedback(id, chosen === correct, act.exp, grade);
}

function selectTF(id, chosen, correct) {
  const tTrue = document.getElementById(`tf_${id}_true`);
  const tFalse = document.getElementById(`tf_${id}_false`);
  if (tTrue.classList.contains('correct-tf') || tTrue.classList.contains('wrong-tf')) return;

  const grade = parseInt(id.split('_')[0]);
  state.scores[grade].total++;

  const isCorrect = chosen === correct;
  const chosenBtn = chosen ? tTrue : tFalse;
  const correctBtn = correct ? tTrue : tFalse;

  chosenBtn.classList.add(isCorrect ? 'correct-tf' : 'wrong-tf');
  if (!isCorrect) correctBtn.classList.add('correct-tf');

  const actIdx = parseInt(id.split('_')[2]);
  const topicId = id.split('_')[1];
  const act = DATA[grade].activities[topicId][actIdx];
  showFeedback(id, isCorrect, act.exp, grade);
}

function checkFill(id, blanks) {
  let allCorrect = true;
  const grade = parseInt(id.split('_')[0]);
  state.scores[grade].total++;

  blanks.forEach((b, i) => {
    const input = document.getElementById(`fill_${id}_${i}`);
    const val = input.value.trim().toLowerCase();
    const expected = b.toLowerCase();
    if (val === expected) {
      input.classList.add('correct-fill');
    } else {
      input.classList.add('wrong-fill');
      allCorrect = false;
    }
  });

  const actIdx = parseInt(id.split('_')[2]);
  const topicId = id.split('_')[1];
  const act = DATA[grade].activities[topicId][actIdx];
  showFeedback(id, allCorrect, act.exp, grade);
  document.querySelector(`button[onclick="checkFill('${id}',${JSON.stringify(blanks)})"]`).disabled = true;
}

function useWord(id, chipIdx, word) {
  const chip = document.getElementById(`chip_${id}_${chipIdx}`);
  if (chip.classList.contains('used')) return;
  const blanks = document.querySelectorAll(`[id^="fill_${id}_"]`);
  for (const blank of blanks) {
    if (!blank.value) { blank.value = word; chip.classList.add('used'); return; }
  }
}

let matchSelected = {};
function pickLeft(id, i) {
  document.querySelectorAll(`[id^="ml_${id}_"]`).forEach(el => el.classList.remove('selected-left'));
  const el = document.getElementById(`ml_${id}_${i}`);
  if (window[`matchData_${id}`].pairs.some(p => p.left === i)) return;
  matchSelected[id] = { left: i };
  el.classList.add('selected-left');
}

function pickRight(id, i) {
  if (!matchSelected[id]) return;
  const leftIdx = matchSelected[id].left;
  const data = window[`matchData_${id}`];
  if (data.pairs.some(p => p.right === i)) return;

  const leftEl = document.getElementById(`ml_${id}_${leftIdx}`);
  const rightEl = document.getElementById(`mr_${id}_${i}`);
  const origRightIdx = data.rightShuffled[i].origIdx;
  const correct = data.ans[leftIdx] === origRightIdx;

  leftEl.classList.remove('selected-left');

  if (correct) {
    leftEl.classList.add('paired');
    rightEl.classList.add('paired');
    data.pairs.push({ left: leftIdx, right: i });

    if (data.pairs.length === data.left.length) {
      const grade = parseInt(id.split('_')[0]);
      state.scores[grade].total++;
      const actIdx = parseInt(id.split('_')[2]);
      const topicId = id.split('_')[1];
      const act = DATA[grade].activities[topicId][actIdx];
      showFeedback(id, true, act.exp, grade);
    }
  } else {
    rightEl.classList.add('wrong-pair');
    setTimeout(() => rightEl.classList.remove('wrong-pair'), 400);
  }
  matchSelected[id] = null;
}

function dragStart(id, i) { window[`orderData_${id}`].dragSrc = i; document.getElementById(`oi_${id}_${i}`).classList.add('dragging'); }
function dragOver(e, id, i) { e.preventDefault(); document.getElementById(`oi_${id}_${i}`).classList.add('drag-over'); }
function dragLeave(id, i) { document.getElementById(`oi_${id}_${i}`).classList.remove('drag-over'); }
function drop(e, id, i) {
  e.preventDefault();
  const data = window[`orderData_${id}`];
  const src = data.dragSrc;
  if (src === i) { document.getElementById(`oi_${id}_${i}`).classList.remove('drag-over'); return; }
  [data.items[src], data.items[i]] = [data.items[i], data.items[src]];
  const list = document.getElementById(`order_${id}`);
  const items = [...list.children];
  const temp = items[src].cloneNode(true);
  list.insertBefore(items[i].cloneNode(true), items[src]);
  list.replaceChild(temp, items[i]);
  items[src].classList.remove('dragging');
  document.getElementById(`oi_${id}_${i}`).classList.remove('drag-over');
  // re-init drag handlers
  [...list.children].forEach((el, idx) => {
    el.id = `oi_${id}_${idx}`;
    el.setAttribute('data-idx', idx);
    el.ondragstart = () => dragStart(id, idx);
    el.ondragover = (ev) => dragOver(ev, id, idx);
    el.ondrop = (ev) => drop(ev, id, idx);
    el.ondragleave = () => dragLeave(id, idx);
    el.querySelector('.order-number').textContent = idx+1;
  });
  window[`orderData_${id}`].dragSrc = null;
}

function checkOrder(id) {
  const data = window[`orderData_${id}`];
  const list = document.getElementById(`order_${id}`);
  const currentOrder = [...list.children].map(el => parseInt(el.getAttribute('data-idx') || el.id.split('_').pop()));
  const correct = data.correctOrder;
  const currentOrigIdxs = data.items.map(it => it.origIdx);
  const isCorrect = correct.every((c, i) => c === currentOrigIdxs[i]);

  const grade = parseInt(id.split('_')[0]);
  state.scores[grade].total++;
  const actIdx = parseInt(id.split('_')[2]);
  const topicId = id.split('_')[1];
  const act = DATA[grade].activities[topicId][actIdx];
  showFeedback(id, isCorrect, act.exp, grade);
  document.querySelector(`button[onclick="checkOrder('${id}')"]`).disabled = true;
}

function showFeedback(id, correct, exp, grade) {
  const fb = document.getElementById(`fb_${id}`);
  fb.className = `feedback show ${correct ? 'ok' : 'err'}`;
  fb.innerHTML = `<strong>${correct ? '✔ ¡Correcto!' : '✘ No es correcto.'}</strong> ${exp}`;
  if (correct) {
    state.scores[grade].correct++;
  }
  updateScoreDisplay(grade);
}

function updateScoreDisplay(grade) {
  const el = document.getElementById(`score-display-${grade}`);
  if (el) el.textContent = `${state.scores[grade].correct} / ${state.scores[grade].total}`;
}

function resetScore(grade) {
  state.scores[grade] = { correct: 0, total: 0 };
  updateScoreDisplay(grade);
  renderContent(grade, state['topic'+grade]);
}

function initMatchActivities(grade, topicId, activities) { /* already set via onclick */ }
function initOrderActivities(grade, topicId, activities) { /* already set via dragstart etc */ }

init();
</script>
